<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Video Player</title>

    <!-- Script Adcash Autotag Resmi -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        aclib.runAutoTag({
            zoneId: 'varv5rerkkh',
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            line-height: 1.4;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background-color: #141414;
            border-bottom: 2px solid #ff0055;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff0055;
        }

        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .watch-section {
            width: 100%;
            background-color: #141414;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        video {
            width: 100%;
            max-height: 580px;
            display: block;
            margin: 0 auto;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* Overlay Tombol Play Besar di Tengah */
        .main-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }

        .play-icon-besar {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 0, 85, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        .play-triangle-besar {
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid #ffffff;
            margin-left: 4px;
        }

        .video-details {
            margin-top: 14px;
        }

        .video-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .tag {
            background-color: #222;
            color: #ff0055;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #333;
            text-decoration: none;
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 13px;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 10px 0;
            margin-top: 10px;
        }

        /* Tombol Call to Action Utama Seperti di Gambar */
        .cta-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-tonton {
            display: block;
            width: 100%;
            background-color: #ff0055;
            color: white;
            text-align: center;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .btn-kunjung {
            display: block;
            width: 100%;
            background-color: #1f1f1f;
            color: #fff;
            text-align: center;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Stream<span>Hub</span></div>
    </header>

    <main class="main-container">
        
        <section class="watch-section">
            <div class="video-wrapper">
                <video id="videoUtama" poster="https://i.ibb.co.com/mVD9tZhq/IMG-20260917-033012.jpg">
                    <source src="https://files.catbox.moe/ehyytj.mp4" type="video/mp4">
                    Browser Anda tidak mendukung tag video.
                </video>
                
                <!-- Overlay yang langsung memicu Smartlink saat diklik -->
                <div class="main-video-overlay" id="overlayUtama" onclick="bukaIklanDanPutar()">
                    <div class="play-icon-besar">
                        <div class="play-triangle-besar"></div>
                    </div>
                </div>
            </div>
            
            <div class="video-details">
                <h1 class="video-title">Main sama pacar 💦</h1>
                
                <div class="tags-container">
                    <span class="tag">🔥 Hot Trend</span>
                    <span class="tag">🛡️ HD Quality</span>
                </div>

                <div class="video-stats">
                    <span>👁 957k Penonton</span>
                    <span>👍 98% Suka</span>
                </div>

                <!-- Tombol aksi utama persis seperti gambar referensi -->
                <div class="cta-container">
                    <a href="https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af" class="btn-tonton" target="_blank">▶ TONTON VIDEO SEKARANG</a>
                    <a href="https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af" class="btn-kunjung" target="_blank">🌐 Kunjungi Website</a>
                </div>
            </div>
        </section>

    </main>

    <script>
        const smartLink = "https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af";
        const video = document.getElementById('videoUtama');
        const overlay = document.getElementById('overlayUtama');

        function bukaIklanDanPutar() {
            // Membuka tab iklan secara instan mengikuti interaksi klik pengguna
            window.open(smartLink, '_blank');
            overlay.style.display = 'none';
            video.play();
        }
    </script>
</body>
</html>
